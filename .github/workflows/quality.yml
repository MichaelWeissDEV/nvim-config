# The quality gate. Single definition, called by both ci.yml and
# release.yml via `workflow_call`, so the checks a release is gated on are
# by construction the same ones every push runs. Previously ci.yml and
# release.yml each carried their own copy of the matrix, which is a
# divergence waiting to happen.
#
# Every third-party action is pinned to a full commit SHA with the human
# readable version in a trailing comment. A tag is a moving target: it can
# be repointed at different code after review. Dependabot bumps these (see
# .github/dependabot.yml) and rewrites both the SHA and the comment.
name: Quality

on:
  workflow_call:

permissions:
  contents: read

env:
  # Pinned rather than `latest`: a formatter that changes under you turns
  # an unrelated push red, and "reproducible" has to include the tools.
  STYLUA_VERSION: v2.5.2
  # The compatibility contract from lua/util/version.lua. The minimum-
  # version lane exists to prove the config still runs on the oldest
  # Neovim it claims to support -- do not drop it in favour of `stable`.
  NVIM_MINIMUM: v0.12.0

jobs:
  lua-format:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.STYLUA_VERSION }}
          # pack/vendor/ is excluded on purpose: vendored plugins keep
          # their upstream formatting, we do not reformat other projects.
          args: --check lua/ after/ scripts/ tests/

  # Static checks that need Neovim but not a platform matrix: running them
  # once is enough, and keeping them out of the matrix keeps its output
  # about platform differences.
  static:
    name: registry + plugin integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable

      - name: Registry integrity
        run: nvim --headless -u init.lua -l tests/test_registry_integrity.lua

      - name: Plugin manifest, lockfile and vendored directories agree
        run: bash scripts/plugin-verify.sh

      - name: Plugin vendoring is atomic
        run: bash tests/test_plugin_vendoring.sh

      # Release-note extraction only ever runs during a release, which is
      # the worst possible moment to discover it is broken -- as it was,
      # from the day it was written. Checked on every push instead.
      - name: Release notes extract from the changelog
        run: bash tests/test_release_notes.sh

      # docs/_generated/*.md is committed because Read the Docs cannot run
      # Neovim to regenerate it. This guards the failure mode that creates:
      # a registry change committed without re-running the generator,
      # leaving the published tables stale. Needs Neovim, hence this job --
      # a bare `git diff` without regenerating would always pass.
      - name: Generated documentation is up to date
        run: |
          nvim --headless -u init.lua -l scripts/generate-docs.lua
          if ! git diff --quiet -- docs/_generated doc/nvim-config.txt; then
            echo "::error::docs/_generated is stale -- run ./scripts/docs-build.sh and commit the result"
            git --no-pager diff -- docs/_generated doc/nvim-config.txt
            exit 1
          fi

  # Full POSIX suite. tests/run.sh isolates each check with XDG_* overrides
  # and builds a stripped-PATH sandbox out of symlinks for the
  # missing-dependency test -- both POSIX-specific, hence the separate
  # Windows job below rather than one three-way matrix.
  #
  # `nvim` covers both the minimum supported version and the current
  # stable one: the former is the compatibility contract, the latter is
  # what people actually run.
  tests:
    name: tests (${{ matrix.os }}, nvim ${{ matrix.nvim }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: [v0.12.0, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim ${{ matrix.nvim }}
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Show versions
        run: nvim --version

      # The suite asserts a quiet startup with NO language tooling present,
      # which is exactly the state of a fresh CI runner -- no setup needed.
      - name: Run tests
        run: bash tests/run.sh

  # Windows runs the platform-independent Lua tests directly instead of
  # tests/run.sh. Two tests are deliberately NOT covered here, and their
  # absence from the list below is intentional rather than an oversight:
  #   * test_missing_deps.lua rebuilds PATH from a symlink sandbox with
  #     `env -i`, which has no faithful Windows equivalent.
  #   * test_directory_arg.lua needs the `--cmd source` + directory-argument
  #     invocation (VimEnter fires after -c arguments), not `nvim -l`.
  # Everything else -- quiet startup, nothing eagerly loaded, lazy-load
  # triggers and their failure semantics, command context, registry
  # integrity, the version contract -- is the same assertion set as POSIX.
  tests-windows:
    name: tests (windows-latest, nvim ${{ matrix.nvim }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [v0.12.0, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim ${{ matrix.nvim }}
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Show versions
        run: nvim --version

      - name: Startup exits cleanly
        run: |
          nvim --headless -u init.lua "+qa"
          if ($LASTEXITCODE -ne 0) { throw "nvim exited with $LASTEXITCODE" }

      # Every test runs even after one fails, and each failure is emitted as
      # a GitHub annotation carrying the test name and its output. Reading a
      # workflow *log* requires an authenticated token; annotations are
      # readable without one, which is the difference between diagnosing a
      # Windows-only failure from a POSIX machine and guessing at it.
      - name: Lua test scripts
        run: |
          # Native stderr surfaces as ErrorRecords. Under the default "Stop"
          # preference that aborts the step before $LASTEXITCODE is read, so
          # the exit code -- not PowerShell's error stream -- decides here.
          $ErrorActionPreference = "Continue"
          $tests = @(
            "tests/test_bootstrap.lua",
            "tests/test_version.lua",
            "tests/test_registry_integrity.lua",
            "tests/test_lazyload_failure.lua",
            "tests/test_lazyload_command_context.lua",
            "tests/test_lsp_registry.lua",
            "tests/test_tools_refresh.lua",
            "tests/test_process.lua",
            "tests/test_startup.lua",
            "tests/test_lazy_load.lua",
            "tests/test_commands.lua"
          )
          $failed = @()
          foreach ($t in $tests) {
            Write-Host "== $t"
            $out = (& nvim --headless -u init.lua -l $t 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Host $out
            if ($code -ne 0) {
              $body = "$t exited $code`n$out"
              $encoded = $body -replace "`r", "" -replace "`n", "%0A"
              Write-Host "::error title=Windows Lua test failed::$encoded"
              $failed += $t
            }
          }
          if ($failed.Count -gt 0) { throw ("failed: " + ($failed -join ", ")) }

      - name: Health check runs without error
        run: |
          nvim --headless -u init.lua -c "checkhealth nvim-config" -c "qa"
          if ($LASTEXITCODE -ne 0) { throw "checkhealth failed" }

      # The .ps1 scripts cannot be syntax-checked on the POSIX development
      # machine (no pwsh there), so this is the only place a typo in them
      # would be caught before a user hits it. Parse-only: the installer is
      # NOT executed, because it would relink this runner's real
      # %LOCALAPPDATA%\nvim.
      - name: PowerShell scripts parse
        run: |
          $failed = $false
          foreach ($f in @("scripts/install.ps1","scripts/bootstrap.ps1","scripts/docs-build.ps1")) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              Write-Host "::error::$f has $($errs.Count) syntax error(s)"
              $errs | ForEach-Object { Write-Host "  $_" }
              $failed = $true
            } else {
              Write-Host "$f : OK"
            }
          }
          if ($failed) { throw "PowerShell syntax errors" }

  docs:
    name: Sphinx (-W)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      # Same strictness as .readthedocs.yaml's fail_on_warning, so a docs
      # regression fails here before it fails the hosted build.
      - name: Build docs
        run: sphinx-build -W -b html docs docs/_build/html
