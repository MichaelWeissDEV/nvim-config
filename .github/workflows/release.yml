# Creates a GitHub Release when a vX.Y.Z tag is pushed.
#
# Flow
# ----
#   1. The shared quality gate (quality.yml) runs at the tagged commit --
#      the *same* definition ci.yml uses, not a copy of it. A release
#      therefore cannot be cut against weaker checks than a normal push.
#   2. The release body is extracted from CHANGELOG.md: the section between
#      this version's heading and the next one.
#   3. The release is created as a draft so it can be reviewed before
#      publishing. Drop --draft to publish immediately.
#
# Secrets: only GITHUB_TOKEN, provided automatically.
#
# Triggering:
#   git tag -a v0.1.1 -m "v0.1.1"
#   git push origin v0.1.1
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  # The gate. Identical to what every push runs -- one definition, in
  # quality.yml. Previously this file carried its own copy of the whole
  # matrix, which could silently drift from the one CI actually enforced.
  quality:
    uses: ./.github/workflows/quality.yml

  release:
    name: Create GitHub Release
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create releases

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the tag annotation is available.
          fetch-depth: 0

      # Strip the leading "v" to match the CHANGELOG heading style:
      #   ## [0.1.1] - 2026-08-13
      - name: Derive version string
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG section
        id: notes
        run: |
          VER="${{ steps.version.outputs.ver }}"
          awk \
            -v start="## \\[${VER}\\]" \
            '/^## \[/{found=0} found{print} $0 ~ start{found=1}' \
            CHANGELOG.md \
            > release_notes.md

          echo "--- release notes preview ---"
          cat release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::No CHANGELOG section found for version ${VER}."
            echo "::error::Add a '## [${VER}]' entry to CHANGELOG.md before tagging."
            exit 1
          fi

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "v${{ steps.version.outputs.ver }}" \
            --notes-file release_notes.md \
            --draft \
            --verify-tag
