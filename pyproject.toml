[project]
name = "nvim-config-docs"
version = "0.1.0"
description = "Pinned build dependencies for this repository's local Sphinx documentation (docs/). Not an installable package -- nothing here ships in the editor config itself. scripts/docs-build.sh and docs-build.ps1 install these exact version ranges directly into docs/.venv; keep both in sync with this file."
requires-python = ">=3.9"

[project.optional-dependencies]
docs = [
    "sphinx>=8.0,<9",
    "myst-parser>=4.0,<5",
]
