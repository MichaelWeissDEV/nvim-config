# This repository is a Neovim configuration, not a Python package. The only
# Python involved is the Sphinx toolchain that builds docs/.
#
# Those dependencies are pinned in exactly one place -- docs/requirements.txt --
# which is what Read the Docs (/.readthedocs.yaml) and both docs-build scripts
# install from. This file exists only so the docs extra is discoverable through
# the conventional `pip install .[docs]`, and it deliberately does not repeat
# the version pins.

[project]
name = "nvim-config-docs"
version = "0.1.0"
description = "Sphinx toolchain for building this Neovim configuration's documentation. Not an installable library."
requires-python = ">=3.9"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
optional-dependencies.docs = { file = ["docs/requirements.txt"] }
dependencies = { file = [] }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
